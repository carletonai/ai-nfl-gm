# Install once with `uv run pre-commit install`; hooks then run on every commit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      # Raw data dumps do not belong in git. 500 KB is generous for code and docs.
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: ^uv\.lock$
  # Ruff runs through uv so the hook uses the exact version in uv.lock, same as CI.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

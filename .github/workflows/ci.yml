name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint and test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      # Every uv command in the job uses the matrix interpreter. Without this, `uv run`
      # follows .python-version (3.12), rebuilds the venv and drops the extras.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install project
        run: uv sync --locked --all-extras

      - name: Ruff lint
        run: uv run --no-sync ruff check . --output-format=github

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Tests
        run: uv run --no-sync pytest -m "not network" --cov --cov-report=term-missing

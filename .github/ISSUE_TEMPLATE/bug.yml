name: Bug
description: Something is wrong in the code, data or docs
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python version, `uv --version`

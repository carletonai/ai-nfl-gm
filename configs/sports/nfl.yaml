# Sport configuration. The code treats the sport as a config so another league
# (NBA next) can follow by adding a sibling file, not by editing the models.
#
# Everything here is a starting point for the Data workstream. Numbers marked
# "verify" must be checked against Over The Cap before they feed a model.

name: nfl
display_name: NFL
currency_label: "% of cap"

# Veteran contracts since this season train the market model (outline, step 2).
market_model_first_season: 2011

# Rookie deals are four cheap years; the fifth-year option (1st round) is a stretch.
rookie_contract_years: 4

# Future picks are discounted roughly x0.85 per year ("one round later" rule of thumb).
future_pick_discount_per_year: 0.85

# League salary cap by season, in millions of USD. Source: Over The Cap
# (https://overthecap.com/salary-cap). VERIFY before use; nflverse contracts already
# carry apy_cap_pct, so this table is for converting cap hits, not for APY.
salary_cap_musd:
  2011: 120.375
  2012: 120.6
  2013: 123.0
  2014: 133.0
  2015: 143.28
  2016: 155.27
  2017: 167.0
  2018: 177.2
  2019: 188.2
  2020: 198.2
  2021: 182.5
  2022: 208.2
  2023: 224.8
  2024: 255.4
  2025: 279.2

# Canonical position groups the models use. Everything else maps onto these.
position_groups:
  - QB
  - RB
  - WR
  - TE
  - OT
  - IOL
  - EDGE
  - IDL
  - LB
  - CB
  - S
  - K
  - P
  - LS

# Position crosswalk: OTC, PFR and NFL rosters disagree (EDGE vs DE/OLB, IDL vs DT).
# Build this on day one (feasibility check). Keys are raw labels as they appear in
# the source tables; values are canonical groups above.
#
# The nflverse contracts table (Over The Cap) uses: QB RB FB WR TE LT LG C RG RT
# ED IDL LB CB S K P LS. Rosters and PFR add DE, DT, NT, OLB, ILB, MLB, FS, SS, G, T.
#
# Known ambiguity (VERIFY): rosters and PFR use OLB for both 3-4 edge rushers and
# 4-3 off-ball linebackers. OTC has no OLB label (each player is filed under ED or
# LB), so OLB -> EDGE below is an unverified default. The Data workstream should
# resolve it per player from OTC's ED/LB assignment, PFR's position or snap data.
# DB -> CB, DL -> IDL and OL -> IOL are lossy defaults for the same reason.
position_crosswalk:
  QB: QB
  RB: RB
  HB: RB
  FB: RB
  WR: WR
  TE: TE
  T: OT
  OT: OT
  LT: OT
  RT: OT
  G: IOL
  OG: IOL
  LG: IOL
  RG: IOL
  C: IOL
  OL: IOL  # verify: lossy
  IOL: IOL
  DE: EDGE
  ED: EDGE
  EDGE: EDGE
  OLB: EDGE  # verify: scheme-dependent, see note above
  DT: IDL
  NT: IDL
  DL: IDL  # verify: lossy
  IDL: IDL
  LB: LB
  ILB: LB
  MLB: LB
  CB: CB
  DB: CB  # verify: lossy
  S: S
  FS: S
  SS: S
  SAF: S
  K: K
  PK: K
  P: P
  LS: LS

# Phase order from the outline: one position end to end before any breadth.
position_rollout:
  - WR
  - EDGE
  - QB

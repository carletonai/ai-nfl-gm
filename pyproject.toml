[project]
name = "ai-nfl-gm"
version = "0.1.0"
description = "Price every NFL player and draft pick in surplus value, then make free-agency, trade and draft decisions from it."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Carleton AI Society" }]
keywords = ["nfl", "nflverse", "salary-cap", "surplus-value", "draft", "sports-analytics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

# Core: enough to pull data, build tables and serve the API. `make setup` installs
# every extra; the split exists so a bare `uv sync` (an API deploy, say) stays small.
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# Market model, valuation engine and prospects workstreams.
ml = [
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "lightgbm>=4.3",
  "xgboost>=2.0",
]
# Exploration. Notebooks are for exploring; code that survives moves into src/.
notebooks = [
  "jupyterlab>=4.2",
  "matplotlib>=3.9",
]

[project.urls]
Repository = "https://github.com/carletonai/ai-nfl-gm"
Club = "https://carletonai.com"

[dependency-groups]
dev = [
  "ruff>=0.17",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_nfl_gm"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "N",   # pep8 naming
]
ignore = [
  "E501", # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not network'"
markers = [
  "network: tests that download data (skipped by default; run them with `pytest -m network`)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["ai_nfl_gm"]
